<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f9d8e6"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="สมุดเงินของฉัน"/>
  <meta name="description" content="สมุดรายรับรายจ่ายสีชมพู บันทึกรายรับ บิลที่ต้องจ่าย และดูเงินเหลือเก็บ"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>🌷 สมุดเงินของฉัน</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Thonburi","Noto Sans Thai",sans-serif;color:#654052;background:#fff7fa;--pink:#e879a4;--deep:#963f68;--line:#f4dce5;--green:#278168}
    *{box-sizing:border-box}body{margin:0;padding:0 0 calc(90px + env(safe-area-inset-bottom));background:linear-gradient(170deg,#ffebf3 0,#fff8fa 300px,#fff9fb 100%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e58daf;outline-offset:2px}.wrap{max-width:670px;margin:auto;padding:22px 16px}.top{text-align:center;padding:13px 0 18px}.top h1{margin:0;font-size:27px;color:#99446c;letter-spacing:-.3px}.muted{color:#a8788d}.top small{font-size:13px}.month{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:19px}.month button{background:#fff;border:1px solid var(--line);border-radius:16px;width:42px;height:39px;color:var(--deep);font-size:22px}.month strong{min-width:175px;color:var(--deep)}.card{background:#fff;border:1px solid #f8e6ed;border-radius:22px;padding:18px;box-shadow:0 5px 22px #e5adc51a;margin-bottom:14px}.hero{background:linear-gradient(125deg,#f8cadd,#fceaf1);text-align:center;padding:22px}.hero .num{font-size:34px;font-weight:800;color:#8d345d;line-height:1.35}.hero .sub{font-size:12px;color:#915b73}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.tile{background:#fff;border:1px solid #f8e6ed;border-radius:18px;padding:16px 13px;min-width:0}.tile .num{font-size:21px;overflow-wrap:anywhere;font-weight:750;margin-top:6px}.tile small{font-size:12px;color:#a36a83}.green{color:#26816b!important}.red{color:#bf5976!important}.title{font-size:17px;font-weight:750;margin:0 0 14px;color:var(--deep)}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.tabs{display:flex;background:#fff0f5;border-radius:17px;padding:5px;gap:5px;margin-bottom:14px}.tabs button{flex:1;border:0;border-radius:13px;background:transparent;color:#9f6781;padding:11px 4px;font-size:14px;font-weight:650}.tabs button.active{background:#fff;color:#9b4069;box-shadow:0 2px 8px #c783a827}.entry{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #f7e8ed}.entry:last-child{border-bottom:0}.entry .main{flex:1;min-width:0}.entry strong{display:block;overflow-wrap:anywhere;font-size:15px}.entry small{display:block;margin-top:3px;color:#a37b8a;font-size:12px}.money{font-weight:750;white-space:nowrap;font-size:15px}.check{width:23px;height:23px;accent-color:#df79a2;flex-shrink:0}.mini{border:0;background:#fff0f5;color:#96546f;border-radius:11px;padding:8px 10px}.badge{border-radius:30px;background:#fff0f5;padding:5px 9px;color:#a75b81;font-size:11px}.badge.ok{background:#e9f7ee;color:#267f5b}.empty{text-align:center;padding:25px;color:#a7758b}.primary{background:#e77da6;color:white;border:0;border-radius:15px;padding:13px 17px;font-weight:750}.outline{background:#fff;border:1px solid #ebbad0;color:#a24e75;border-radius:14px;padding:12px 15px;font-weight:700}.full{width:100%}.actionrow{display:flex;gap:9px}.actionrow>*{flex:1}.summary{background:#fff6f9;border-radius:16px;padding:14px;line-height:1.75;font-size:14px}.formgrid{display:grid;gap:12px}.field label{font-size:13px;color:#8d5871;display:block;margin-bottom:5px;font-weight:600}.field input,.field select{width:100%;border:1px solid #edd6e0;background:#fff;border-radius:12px;padding:12px;color:#624457;font-size:16px;min-height:44px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalbg{position:fixed;inset:0;background:#4026377a;z-index:10;display:flex;justify-content:center;align-items:end;padding:14px}.modal{background:#fffafd;border-radius:24px;max-height:93dvh;overflow:auto;width:min(100%,620px);padding:21px;box-shadow:0 10px 50px #43203b44}.close{font-size:22px;border:0;background:transparent;color:#966078;padding:0 5px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfef5;backdrop-filter:blur(12px);border-top:1px solid #f1dce5;padding:9px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5;box-shadow:0 -5px 30px #efb1cc19}.navinner{display:flex;max-width:650px;width:100%;justify-content:space-around}.nav button{border:0;background:transparent;font-size:12px;color:#9b7486;padding:5px 15px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button span{font-size:22px}.nav button.active{color:#ba507b;font-weight:750}.note{background:#edf9f2;border-radius:14px;padding:13px;color:#38745d;font-size:13px}.warning{background:#fff2eb;border-radius:14px;padding:13px;color:#9d633a;font-size:13px}.pill{font-size:12px;color:#ae6987;background:#fff0f6;padding:6px 10px;border-radius:30px}.progress{height:9px;background:#fae6ee;border-radius:50px;overflow:hidden}.progress>div{height:100%;background:#e57fa8;border-radius:50px;transition:width .2s}.settingsbutton{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);padding:15px;border-radius:14px;margin:8px 0;color:#814c66}.smalltext{font-size:12px;line-height:1.6}.hide{display:none!important}@media(min-width:600px){.modalbg{align-items:center}.wrap{padding-top:28px}.top h1{font-size:31px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><h1>🌷 My Money Diary</h1><small class="muted">สมุดเงินน่ารักของฉัน ♡</small><div class="month"><button id="prev" aria-label="เดือนก่อน">‹</button><strong id="monthName"></strong><button id="next" aria-label="เดือนถัดไป">›</button></div></header>
    <section id="content"></section>
  </main>
  <nav class="nav" aria-label="เมนูหลัก"><div class="navinner"><button data-tab="home" class="active"><span>🏠</span>ภาพรวม</button><button data-tab="bills"><span>🧾</span>บิลที่ต้องจ่าย</button><button data-tab="income"><span>💰</span>รายรับ</button><button data-tab="settings"><span>⚙️</span>ตั้งค่า</button></div></nav>
  <div id="modalRoot"></div>
  <script>
  (()=>{'use strict';
    const KEY='my-money-diary-v1';const monthNames=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    let db=load(),selected=new Date(),tab='home';selected.setDate(1);
    function load(){try{let o=JSON.parse(localStorage.getItem(KEY)||'{}');if(o&&Array.isArray(o.incomes)&&Array.isArray(o.bills))return o;}catch(e){}return {incomes:[],bills:[]}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('ไม่สามารถบันทึกข้อมูลได้ กรุณาตรวจสอบพื้นที่เก็บข้อมูลหรือโหมดส่วนตัวของเบราว์เซอร์')}}
    const $=id=>document.getElementById(id);const money=v=>'฿'+Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
    const mk=()=>selected.getFullYear()+'-'+String(selected.getMonth()+1).padStart(2,'0');const dateLocal=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const timeLocal=()=>{let d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
    const sum=arr=>arr.reduce((n,x)=>n+Number(x.amount||0),0);const monthly=(arr)=>arr.filter(x=>x.month===mk());const calc=()=>{let incomes=monthly(db.incomes),bills=monthly(db.bills),received=sum(incomes.filter(x=>x.received)),expected=sum(incomes),paid=sum(bills.filter(x=>x.paid)),total=sum(bills);return {incomes,bills,received,expected,paid,total,unpaid:total-paid,now:received-paid,forecast:expected-total,available:received-total}};
    const dateView=d=>{if(!d)return 'ไม่ระบุ';let [y,m,day]=d.split('-').map(Number);return `${day} ${monthNames[m-1]?.slice(0,3)||''} ${y+543}`};
    const when=x=>dateView(x.paid?x.paidDate:x.received?x.receivedDate:x.dueDate||x.expectedDate)+(x.paid&&x.paidTime?' · '+x.paidTime+' น.':x.received&&x.receivedTime?' · '+x.receivedTime+' น.':'');
    function render(){const c=calc();$('monthName').textContent=monthNames[selected.getMonth()]+' '+(selected.getFullYear()+543);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';
      if(tab==='home')html=home(c);if(tab==='bills')html=billsPage(c);if(tab==='income')html=incomePage(c);if(tab==='settings')html=settingsPage();$('content').innerHTML=html;}
    function home(c){let note=c.forecast>=0?`🌼 ถ้าได้รับรายรับตามแผนและจ่ายบิลครบ จะเหลือเก็บ ${money(c.forecast)}`:`🌧️ รายรับตามแผนยังไม่พอจ่าย ขาดอีก ${money(-c.forecast)}`;
      let txt=`เดือนนี้มีรายรับที่ได้รับจริง ${money(c.received)} และมีรายรับที่ยังรอรับ ${money(c.expected-c.received)} บิลที่ต้องจ่ายทั้งหมด ${money(c.total)} จ่ายไปแล้ว ${money(c.paid)} ยังต้องจ่าย ${money(c.unpaid)} เงินคงเหลือตามรายการที่บันทึก ${money(c.now)} ${note}`;
      return `<div class="card hero"><div>💗 เงินคงเหลือตอนนี้</div><div class="num">${money(c.now)}</div><div class="sub">รายรับที่ได้รับจริง − บิลที่จ่ายแล้ว</div></div>
      <div class="grid"><div class="tile"><small>💰 รายรับที่ได้รับแล้ว</small><div class="num green">${money(c.received)}</div></div><div class="tile"><small>🕒 รายรับรอเข้า</small><div class="num">${money(c.expected-c.received)}</div></div><div class="tile"><small>🧾 บิลทั้งหมด</small><div class="num">${money(c.total)}</div></div><div class="tile"><small>⏳ บิลยังไม่จ่าย</small><div class="num red">${money(c.unpaid)}</div></div></div>
      <div class="card"><div class="title">🐷 เงินที่คาดว่าจะเหลือเก็บ</div><div style="font-size:27px;font-weight:800;color:${c.forecast>=0?'#278168':'#bd5974'}">${c.forecast<0?'−':''}${money(Math.abs(c.forecast))}</div><small class="muted">คำนวณจากรายรับที่บันทึกทั้งหมด (รวมเงินรอเข้า) − บิลทุกใบ</small><div style="height:12px"></div><div class="${c.available>=0?'note':'warning'}">${c.available>=0?`หากไม่ได้เงินเข้าเพิ่มและจ่ายบิลที่เหลือครบ จะเหลือ ${money(c.available)}`:`หากไม่ได้เงินเข้าเพิ่ม ต้องมีเงินอีก ${money(-c.available)} เพื่อจ่ายบิลที่เหลือครบ`}</div></div>
      <div class="actionrow" style="margin-bottom:14px"><button class="primary" data-add="income">＋ เพิ่มรายรับ</button><button class="outline" data-add="bill">＋ เพิ่มบิล</button></div>
      <div class="card"><div class="row between"><h2 class="title">💕 บิลที่ต้องจ่ายเดือนนี้</h2><span class="pill">${c.bills.filter(x=>x.paid).length}/${c.bills.length} จ่ายแล้ว</span></div><div class="progress"><div style="width:${c.total?100*c.paid/c.total:0}%"></div></div>${billRows(c.bills)}<button class="outline full" data-tab="bills">ดูรายการบิลทั้งหมด</button></div>
      <div class="card"><h2 class="title">🧸 สรุปเดือนนี้</h2><div class="summary">${txt}</div><button class="outline full" style="margin-top:10px" data-copy="summary">📋 คัดลอกสรุปไปส่ง LINE</button></div>`;
    }
    function billRows(arr){if(!arr.length)return '<p class="empty">🌼 ยังไม่มีบิล กดเพิ่มรายการได้เลย</p>';return [...arr].sort((a,b)=>Number(a.paid)-Number(b.paid)||(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).map(b=>`<div class="entry"><input class="check" type="checkbox" aria-label="จ่ายแล้ว ${esc(b.name)}" data-toggle-bill="${esc(b.id)}" ${b.paid?'checked':''}/><div class="main"><strong>${esc(b.name)}</strong><small>${b.paid?'✅ จ่ายแล้ว '+when(b):'⏳ รอจ่าย'+(b.dueDate?' · กำหนด '+dateView(b.dueDate):'')}</small></div><div class="money">${money(b.amount)}</div><button class="mini" data-edit-bill="${esc(b.id)}" aria-label="แก้ไข ${esc(b.name)}">✎</button></div>`).join('')}
    function incomeRows(arr){if(!arr.length)return '<p class="empty">🌷 ยังไม่มีรายรับ กดเพิ่มรายรับได้เลย</p>';return [...arr].sort((a,b)=>(b.receivedDate||b.expectedDate||'').localeCompare(a.receivedDate||a.expectedDate||'')).map(x=>`<div class="entry"><input class="check" type="checkbox" aria-label="เงินเข้าแล้ว ${esc(x.name)}" data-toggle-income="${esc(x.id)}" ${x.received?'checked':''}/><div class="main"><strong>${esc(x.name)}</strong><small>${x.received?'✅ เงินเข้าแล้ว '+when(x):'🕒 รอเงินเข้า'+(x.expectedDate?' · คาดว่า '+dateView(x.expectedDate):'')}</small></div><div class="money green">+${money(x.amount)}</div><button class="mini" data-edit-income="${esc(x.id)}" aria-label="แก้ไข ${esc(x.name)}">✎</button></div>`).join('')}
    function billsPage(c){return `<div class="card"><h2 class="title">🧾 บิลเดือนนี้</h2><div class="grid" style="margin:0"><div class="tile"><small>ต้องจ่าย</small><div class="num">${money(c.total)}</div></div><div class="tile"><small>ยังไม่จ่าย</small><div class="num red">${money(c.unpaid)}</div></div></div><button class="primary full" style="margin-top:14px" data-add="bill">＋ จดบิลใหม่</button></div><div class="card"><h2 class="title">💕 เช็กลิสต์บิลของฉัน</h2><p class="muted smalltext">ติ๊กช่องเมื่อจ่ายแล้ว ระบบจะบันทึกวันและเวลาปัจจุบันให้อัตโนมัติ หรือกด ✎ เพื่อแก้ไขวันที่ย้อนหลัง</p>${billRows(c.bills)}</div>`}
    function incomePage(c){return `<div class="card"><h2 class="title">💰 เงินเข้าหลายทาง</h2><div class="grid" style="margin:0"><div class="tile"><small>รับแล้ว</small><div class="num green">${money(c.received)}</div></div><div class="tile"><small>รอรับ</small><div class="num">${money(c.expected-c.received)}</div></div></div><button class="primary full" style="margin-top:14px" data-add="income">＋ จดรายรับใหม่</button></div><div class="card"><h2 class="title">🌷 รายการเงินเข้าของฉัน</h2><p class="muted smalltext">เพิ่มเงินเดือน เงินเวร รายได้เสริม หรือรายรับอื่น ๆ และกำหนดวันที่ได้รับจริงได้</p>${incomeRows(c.incomes)}</div>`}
    function settingsPage(){return `<div class="card"><h2 class="title">⚙️ ดูแลสมุดของฉัน</h2><p class="muted smalltext">ข้อมูลถูกเก็บไว้ในเบราว์เซอร์เครื่องนี้ ไม่ได้ส่งขึ้นเซิร์ฟเวอร์ โปรดสำรองข้อมูลเป็นประจำ โดยเฉพาะก่อนเปลี่ยนโทรศัพท์หรือล้างข้อมูล Safari</p><button class="settingsbutton" data-export="1">📦 สำรองข้อมูลเป็นไฟล์ JSON <span>↓</span></button><button class="settingsbutton" data-import="1">📂 นำเข้าข้อมูลที่สำรองไว้ <span>↑</span></button><input type="file" id="importFile" accept="application/json,.json" style="display:none"/><button class="settingsbutton" data-copy="summary">📋 คัดลอกสรุปเดือนนี้ <span>↗</span></button></div><div class="card"><h2 class="title">📱 วิธีไว้บนหน้าจอ iPhone</h2><p class="smalltext">เมื่ออัปโหลดเว็บนี้ขึ้น HTTPS แล้ว เปิดลิงก์ด้วย Safari → กดแชร์ → เพิ่มไปยังหน้าจอโฮม จากนั้นเปิดเหมือนแอปทั่วไปได้เลย</p><div class="warning">ข้อมูลของเวอร์ชันนี้เก็บแยกตามเบราว์เซอร์/อุปกรณ์ ไม่ซิงก์อัตโนมัติข้ามเครื่อง และการล้างข้อมูลเว็บไซต์อาจลบสมุดได้</div></div>`}
    function modal(type,item){let isIncome=type==='income',isEdit=!!item, nowDate=dateLocal(),nowTime=timeLocal(),name=item?.name||'',amt=item?.amount??'',status=isIncome?item?.received??true:item?.paid??false, date=isIncome?(item?.receivedDate||nowDate):(item?.paidDate||nowDate),time=isIncome?(item?.receivedTime||nowTime):(item?.paidTime||nowTime),plan=isIncome?(item?.expectedDate||nowDate):(item?.dueDate||nowDate);
      $('modalRoot').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row between"><h2 class="title" id="modalTitle">${isIncome?'💰':'🧾'} ${isEdit?'แก้ไข':'เพิ่ม'}${isIncome?'รายรับ':'บิลที่ต้องจ่าย'}</h2><button class="close" data-close="1" aria-label="ปิด">×</button></div><form id="recordForm" class="formgrid"><div class="field"><label for="recName">${isIncome?'ชื่อรายรับ':'ชื่อบิล'}</label><input id="recName" required maxlength="80" placeholder="${isIncome?'เช่น เงินเดือน เงินเวร รายได้เสริม':'เช่น ค่าห้อง ค่าผ่อนรถ ค่าไฟ'}" value="${esc(name)}"/></div><div class="field"><label for="recAmount">จำนวนเงิน (บาท)</label><input id="recAmount" type="number" min="0.01" max="999999999999" step="0.01" inputmode="decimal" required placeholder="0" value="${esc(amt)}"/></div><div class="field"><label for="recPlan">${isIncome?'วันที่คาดว่าเงินจะเข้า':'วันครบกำหนดจ่าย'} (ไม่บังคับ)</label><input id="recPlan" type="date" value="${esc(plan)}"/></div><label class="row" style="gap:12px"><input id="recStatus" class="check" type="checkbox" ${status?'checked':''}/><b>${isIncome?'✅ ได้รับเงินแล้ว':'✅ จ่ายแล้ว'}</b></label><div id="actualGroup" class="two ${status?'':'hide'}"><div class="field"><label for="recDate">วันที่${isIncome?'เงินเข้า':'จ่ายจริง'}</label><input id="recDate" type="date" value="${esc(date)}"/></div><div class="field"><label for="recTime">เวลา</label><input id="recTime" type="time" value="${esc(time)}"/></div></div><button class="primary full" type="submit">💗 บันทึกข้อมูล</button>${isEdit?'<button class="outline full" type="button" id="deleteRecord">🗑️ ลบรายการนี้</button>':''}</form></div></div>`;
      $('recStatus').addEventListener('change',()=>{$('actualGroup').classList.toggle('hide',!$('recStatus').checked)});
      $('recordForm').addEventListener('submit',e=>{e.preventDefault();let a=Number($('recAmount').value),n=$('recName').value.trim(),checked=$('recStatus').checked;if(!n||!Number.isFinite(a)||a<=0||a>999999999999)return alert('กรุณากรอกชื่อและจำนวนเงินให้ถูกต้อง');if(checked&&!$('recDate').value)return alert('กรุณาเลือกวันที่จริง');let record={id:item?.id||('r'+Date.now()+Math.random().toString(36).slice(2)),month:mk(),name:n,amount:Math.round(a*100)/100};if(isIncome){Object.assign(record,{received:checked,expectedDate:$('recPlan').value,receivedDate:checked?$('recDate').value:'',receivedTime:checked?$('recTime').value:''})}else{Object.assign(record,{paid:checked,dueDate:$('recPlan').value,paidDate:checked?$('recDate').value:'',paidTime:checked?$('recTime').value:''})}let array=isIncome?db.incomes:db.bills;if(isEdit){let at=array.findIndex(x=>x.id===item.id);if(at>=0)array[at]=record}else array.push(record);save();closeModal();render()});
      if(isEdit)$('deleteRecord').addEventListener('click',()=>{if(confirm('ลบรายการนี้ใช่ไหม?')){let arr=isIncome?db.incomes:db.bills;let i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr.splice(i,1);save();closeModal();render()}});
      $('recName').focus();
    }
    function closeModal(){$('modalRoot').innerHTML=''}
    function toggle(type,id,checked){let arr=type==='income'?db.incomes:db.bills,rec=arr.find(x=>x.id===id);if(!rec)return;let nowDate=dateLocal(),nowTime=timeLocal();if(type==='income'){rec.received=checked;rec.receivedDate=checked?nowDate:'';rec.receivedTime=checked?nowTime:''}else{rec.paid=checked;rec.paidDate=checked?nowDate:'';rec.paidTime=checked?nowTime:''}save();render()}
    function summary(){let c=calc();return `🌷 สมุดเงิน ${monthNames[selected.getMonth()]} ${selected.getFullYear()+543}\n💰 รับแล้ว ${money(c.received)}\n🕒 รอรับ ${money(c.expected-c.received)}\n🧾 บิลรวม ${money(c.total)}\n✅ จ่ายแล้ว ${money(c.paid)}\n⏳ ยังต้องจ่าย ${money(c.unpaid)}\n💗 เหลือตอนนี้ ${money(c.now)}\n🐷 คาดว่า${c.forecast>=0?'เหลือเก็บ '+money(c.forecast):'ขาดอีก '+money(-c.forecast)}\n\nรายการบิล:\n${c.bills.map(x=>`${x.paid?'✅':'⬜'} ${x.name} ${money(x.amount)}`).join('\n')||'ไม่มีรายการ'}`}
    function exportData(){let content=JSON.stringify({version:1,exportedAt:new Date().toISOString(),incomes:db.incomes,bills:db.bills},null,2),blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-money-diary-backup-'+dateLocal()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    document.addEventListener('click',async e=>{let t=e.target.closest('button');if(!t)return;if(t.id==='prev'||t.id==='next'){selected.setMonth(selected.getMonth()+(t.id==='prev'?-1:1));render()}else if(t.dataset.tab){tab=t.dataset.tab;render()}else if(t.dataset.add){modal(t.dataset.add)}else if(t.dataset.editBill){modal('bill',db.bills.find(x=>x.id===t.dataset.editBill))}else if(t.dataset.editIncome){modal('income',db.incomes.find(x=>x.id===t.dataset.editIncome))}else if(t.dataset.close){closeModal()}else if(t.dataset.copy){try{await navigator.clipboard.writeText(summary());alert('คัดลอกสรุปแล้วค่ะ 💗')}catch(e){prompt('คัดลอกข้อความนี้',summary())}}else if(t.dataset.export){exportData()}else if(t.dataset.import){$('importFile').click()}});
    document.addEventListener('change',e=>{if(e.target.dataset.toggleBill!==undefined)toggle('bill',e.target.dataset.toggleBill,e.target.checked);if(e.target.dataset.toggleIncome!==undefined)toggle('income',e.target.dataset.toggleIncome,e.target.checked);if(e.target.id==='importFile'){let file=e.target.files[0];if(!file)return;file.text().then(raw=>{try{let obj=JSON.parse(raw);if(!Array.isArray(obj.incomes)||!Array.isArray(obj.bills)||obj.incomes.length>100000||obj.bills.length>100000||![...obj.incomes,...obj.bills].every(x=>x&&typeof x.name==='string'&&x.name.length<=100&&typeof x.month==='string'&&/^\d{4}-\d{2}$/.test(x.month)&&Number.isFinite(Number(x.amount))&&Number(x.amount)>=0&&typeof x.id==='string'))throw Error('invalid');if(!confirm('นำเข้าข้อมูลจะทับข้อมูลปัจจุบันทั้งหมด ต้องการดำเนินการหรือไม่?'))return;db={incomes:obj.incomes,bills:obj.bills};save();render();alert('นำเข้าข้อมูลเรียบร้อยแล้ว 💗')}catch(err){alert('ไฟล์สำรองไม่ถูกต้องหรืออ่านไม่ได้')}});e.target.value=''}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
    render();
  })();
  </script>
</body>
</html>
