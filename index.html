<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f9d8e6"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="สมุดเงินของฉัน"/>
  <meta name="description" content="สมุดรายรับรายจ่ายสีชมพู บันทึกรายรับ บิลที่ต้องจ่าย และดูเงินเหลือเก็บ"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>🌷 สมุดเงินของฉัน</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Thonburi","Noto Sans Thai",sans-serif;color:#654052;background:#fff7fa;--pink:#e879a4;--deep:#963f68;--line:#f4dce5;--green:#278168}
    *{box-sizing:border-box}body{margin:0;padding:0 0 calc(90px + env(safe-area-inset-bottom));background:linear-gradient(170deg,#ffebf3 0,#fff8fa 300px,#fff9fb 100%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e58daf;outline-offset:2px}.wrap{max-width:670px;margin:auto;padding:22px 16px}.top{text-align:center;padding:13px 0 18px}.top h1{margin:0;font-size:27px;color:#99446c;letter-spacing:-.3px}.muted{color:#a8788d}.top small{font-size:13px}.month{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:19px}.month button{background:#fff;border:1px solid var(--line);border-radius:16px;width:42px;height:39px;color:var(--deep);font-size:22px}.month strong{min-width:175px;color:var(--deep)}.card{background:#fff;border:1px solid #f8e6ed;border-radius:22px;padding:18px;box-shadow:0 5px 22px #e5adc51a;margin-bottom:14px}.hero{background:linear-gradient(125deg,#f8cadd,#fceaf1);text-align:center;padding:22px}.hero .num{font-size:34px;font-weight:800;color:#8d345d;line-height:1.35}.hero .sub{font-size:12px;color:#915b73}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.tile{background:#fff;border:1px solid #f8e6ed;border-radius:18px;padding:16px 13px;min-width:0}.tile .num{font-size:21px;overflow-wrap:anywhere;font-weight:750;margin-top:6px}.tile small{font-size:12px;color:#a36a83}.green{color:#26816b!important}.red{color:#bf5976!important}.title{font-size:17px;font-weight:750;margin:0 0 14px;color:var(--deep)}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.tabs{display:flex;background:#fff0f5;border-radius:17px;padding:5px;gap:5px;margin-bottom:14px}.tabs button{flex:1;border:0;border-radius:13px;background:transparent;color:#9f6781;padding:11px 4px;font-size:14px;font-weight:650}.tabs button.active{background:#fff;color:#9b4069;box-shadow:0 2px 8px #c783a827}.entry{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #f7e8ed}.entry:last-child{border-bottom:0}.entry .main{flex:1;min-width:0}.entry strong{display:block;overflow-wrap:anywhere;font-size:15px}.entry small{display:block;margin-top:3px;color:#a37b8a;font-size:12px}.money{font-weight:750;white-space:nowrap;font-size:15px}.check{width:23px;height:23px;accent-color:#df79a2;flex-shrink:0}.mini{border:0;background:#fff0f5;color:#96546f;border-radius:11px;padding:8px 10px}.badge{border-radius:30px;background:#fff0f5;padding:5px 9px;color:#a75b81;font-size:11px}.badge.ok{background:#e9f7ee;color:#267f5b}.empty{text-align:center;padding:25px;color:#a7758b}.primary{background:#e77da6;color:white;border:0;border-radius:15px;padding:13px 17px;font-weight:750}.outline{background:#fff;border:1px solid #ebbad0;color:#a24e75;border-radius:14px;padding:12px 15px;font-weight:700}.full{width:100%}.actionrow{display:flex;gap:9px}.actionrow>*{flex:1}.summary{background:#fff6f9;border-radius:16px;padding:14px;line-height:1.75;font-size:14px}.formgrid{display:grid;gap:12px}.field label{font-size:13px;color:#8d5871;display:block;margin-bottom:5px;font-weight:600}.field input,.field select{width:100%;border:1px solid #edd6e0;background:#fff;border-radius:12px;padding:12px;color:#624457;font-size:16px;min-height:44px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalbg{position:fixed;inset:0;background:#4026377a;z-index:10;display:flex;justify-content:center;align-items:end;padding:14px}.modal{background:#fffafd;border-radius:24px;max-height:93dvh;overflow:auto;width:min(100%,620px);padding:21px;box-shadow:0 10px 50px #43203b44}.close{font-size:22px;border:0;background:transparent;color:#966078;padding:0 5px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfef5;backdrop-filter:blur(12px);border-top:1px solid #f1dce5;padding:9px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5;box-shadow:0 -5px 30px #efb1cc19}.navinner{display:flex;max-width:650px;width:100%;justify-content:space-around}.nav button{border:0;background:transparent;font-size:12px;color:#9b7486;padding:5px 5px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button span{font-size:21px}.nav button.active{color:#ba507b;font-weight:750}.note{background:#edf9f2;border-radius:14px;padding:13px;color:#38745d;font-size:13px}.warning{background:#fff2eb;border-radius:14px;padding:13px;color:#9d633a;font-size:13px}.pill{font-size:12px;color:#ae6987;background:#fff0f6;padding:6px 10px;border-radius:30px}.progress{height:9px;background:#fae6ee;border-radius:50px;overflow:hidden}.progress>div{height:100%;background:#e57fa8;border-radius:50px;transition:width .2s}.settingsbutton{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);padding:15px;border-radius:14px;margin:8px 0;color:#814c66}.smalltext{font-size:12px;line-height:1.6}.hide{display:none!important}@media(min-width:600px){.modalbg{align-items:center}.wrap{padding-top:28px}.top h1{font-size:31px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><h1>🌷 My Money Diary</h1><small class="muted">สมุดเงินน่ารักของฉัน ♡</small><div class="month"><button id="prev" aria-label="เดือนก่อน">‹</button><strong id="monthName"></strong><button id="next" aria-label="เดือนถัดไป">›</button></div></header>
    <section id="content"></section>
  </main>
  <nav class="nav" aria-label="เมนูหลัก"><div class="navinner"><button data-tab="home" class="active"><span>🏠</span>ภาพรวม</button><button data-tab="bills"><span>🧾</span>บิลที่ต้องจ่าย</button><button data-tab="plans"><span>🌼</span>รายจ่ายประจำ</button><button data-tab="income"><span>💰</span>รายรับ</button><button data-tab="settings"><span>⚙️</span>ตั้งค่า</button></div></nav>
  <div id="modalRoot"></div>
  <script>
  (()=>{'use strict';
    const KEY='my-money-diary-v1';const monthNames=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    let db=load(),selected=new Date(),tab='home';selected.setDate(1);db.plans ||= [];db.spends ||= [];
    function load(){try{let o=JSON.parse(localStorage.getItem(KEY)||'{}');if(o&&Array.isArray(o.incomes)&&Array.isArray(o.bills))return o;}catch(e){}return {incomes:[],bills:[],plans:[],spends:[]}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(db));if(localStorage.getItem(KEY)!==JSON.stringify(db))throw Error('readback failed');flash('✅ บันทึกเรียบร้อยแล้ว');return true}catch(e){alert('ไม่สามารถบันทึกถาวรได้ในหน้าที่เปิดอยู่\nกรุณาเปิดลิงก์เว็บไซต์ HTTPS ผ่าน Safari แทนไฟล์ HTML หรือหน้าดูตัวอย่างในแชต');storageNotice();return false}}
    function flash(message){let e=document.getElementById('saveFlash');if(!e){e=document.createElement('div');e.id='saveFlash';e.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;background:#fff;border:1px solid #edb5ca;border-radius:18px;padding:11px 16px;box-shadow:0 8px 30px #a55a7b44;color:#6b3c50;font-weight:700;max-width:92%;text-align:center';document.body.appendChild(e)}e.textContent=message;e.hidden=false;clearTimeout(flash.timer);flash.timer=setTimeout(()=>e.hidden=true,1800)}
    function storageNotice(){let bad=false;try{let k='md-storage-test';localStorage.setItem(k,'yes');bad=localStorage.getItem(k)!=='yes';localStorage.removeItem(k)}catch(e){bad=true}let preview=location.protocol==='file:'||location.protocol==='blob:'||location.protocol==='about:';if(bad||preview){let warning=document.getElementById('storageWarning');if(!warning){warning=document.createElement('div');warning.id='storageWarning';warning.className='card warning';warning.style.cssText='margin:12px auto;max-width:600px;line-height:1.7';document.querySelector('main').prepend(warning)}warning.innerHTML=bad?'⚠️ <b>หน้านี้ไม่อนุญาตให้บันทึกข้อมูลถาวร</b> กรุณาเปิดเว็บไซต์จริงผ่าน Safari (ลิงก์ https://...) ไม่ใช่หน้าแสดงตัวอย่างไฟล์':'⚠️ <b>กำลังเปิดไฟล์ HTML ทดลอง</b> ข้อมูลที่บันทึกอาจไม่อยู่ถาวร โปรดใช้เว็บไซต์ https:// ที่เผยแพร่แล้วเพื่อบันทึกจริง'}}
    const $=id=>document.getElementById(id);const money=v=>'฿'+Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
    const mk=()=>selected.getFullYear()+'-'+String(selected.getMonth()+1).padStart(2,'0');const dateLocal=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const timeLocal=()=>{let d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
    const sum=arr=>arr.reduce((n,x)=>n+Number(x.amount||0),0);const monthly=arr=>arr.filter(x=>x.month===mk());
    const uid=()=>('r'+Date.now().toString(36)+Math.random().toString(36).slice(2));
    const startOfMonth=s=>s+'-01';
    // One independent bill per month. Existing month entries are never overwritten by templates.
    function ensureMonthly(){db.plans ||= [];db.spends ||= [];let change=false;for(let p of db.plans){if(p.kind!=='bill'||p.start>mk())continue; if(!db.bills.some(b=>b.month===mk()&&b.planId===p.id)){let day=Math.min(Math.max(Number(p.day)||1,1),new Date(selected.getFullYear(),selected.getMonth()+1,0).getDate());db.bills.push({id:uid(),planId:p.id,month:mk(),name:p.name,amount:Number(p.amount),paid:false,dueDate:mk()+'-'+String(day).padStart(2,'0'),paidDate:'',paidTime:''});change=true;}}if(change)save()}
    function calc(){ensureMonthly();let incomes=monthly(db.incomes),bills=monthly(db.bills),received=sum(incomes.filter(x=>x.received)),expected=sum(incomes),billPaid=sum(bills.filter(x=>x.paid)),billTotal=sum(bills),budgets=db.plans.filter(p=>p.kind==='budget'&&p.start<=mk()),spends=monthly(db.spends),spendTotal=sum(spends),budgetTotal=sum(budgets),budgetUsed=budgets.reduce((s,p)=>s+sum(spends.filter(x=>x.planId===p.id)),0),extraSpent=sum(spends.filter(x=>!budgets.some(p=>p.id===x.planId)));let total=billTotal+budgets.reduce((s,p)=>s+Math.max(Number(p.amount),sum(spends.filter(x=>x.planId===p.id))),0)+extraSpent,paid=billPaid+spendTotal;return {incomes,bills,budgets,spends,received,expected,paid,total,billPaid,billTotal,spendTotal,unpaid:billTotal-billPaid+Math.max(0,budgetTotal-budgetUsed),now:received-paid,forecast:expected-total,available:received-total,budgetTotal,budgetUsed,extraSpent};}

    const dateView=d=>{if(!d)return 'ไม่ระบุ';let [y,m,day]=d.split('-').map(Number);return `${day} ${monthNames[m-1]?.slice(0,3)||''} ${y+543}`};
    const when=x=>dateView(x.paid?x.paidDate:x.received?x.receivedDate:x.dueDate||x.expectedDate)+(x.paid&&x.paidTime?' · '+x.paidTime+' น.':x.received&&x.receivedTime?' · '+x.receivedTime+' น.':'');
    function render(){const c=calc();$('monthName').textContent=monthNames[selected.getMonth()]+' '+(selected.getFullYear()+543);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';
      if(tab==='home')html=home(c);if(tab==='plans')html=plansPage(c);if(tab==='bills')html=billsPage(c);if(tab==='income')html=incomePage(c);if(tab==='settings')html=settingsPage();$('content').innerHTML=html;}
    function home(c){let note=c.forecast>=0?`🌼 ถ้าได้รับรายรับตามแผนและจ่ายบิลครบ จะเหลือเก็บ ${money(c.forecast)}`:`🌧️ รายรับตามแผนยังไม่พอจ่าย ขาดอีก ${money(-c.forecast)}`;
      let txt=`เดือนนี้มีรายรับที่ได้รับจริง ${money(c.received)} และมีรายรับที่ยังรอรับ ${money(c.expected-c.received)} รายจ่ายที่วางแผนทั้งหมด ${money(c.total)} จ่ายจริงแล้ว ${money(c.paid)} ยังมีบิลและงบคงเหลือ ${money(c.unpaid)} เงินคงเหลือตามรายการที่บันทึก ${money(c.now)} ${note}`;
      return `<div class="card hero"><div>💗 เงินคงเหลือตอนนี้</div><div class="num">${money(c.now)}</div><div class="sub">รายรับที่ได้รับจริง − บิลที่จ่ายแล้ว − ยอดใช้จริงในงบ</div></div>
      <div class="grid"><div class="tile"><small>💰 รายรับที่ได้รับแล้ว</small><div class="num green">${money(c.received)}</div></div><div class="tile"><small>🕒 รายรับรอเข้า</small><div class="num">${money(c.expected-c.received)}</div></div><div class="tile"><small>🧾 รายจ่ายที่วางแผนไว้</small><div class="num">${money(c.total)}</div></div><div class="tile"><small>⏳ ยอดบิลและงบที่ยังเหลือ</small><div class="num red">${money(c.unpaid)}</div></div></div>
      <div class="card"><div class="title">🐷 เงินที่คาดว่าจะเหลือเก็บ</div><div style="font-size:27px;font-weight:800;color:${c.forecast>=0?'#278168':'#bd5974'}">${c.forecast<0?'−':''}${money(Math.abs(c.forecast))}</div><small class="muted">คำนวณจากรายรับทั้งหมด (รวมเงินรอเข้า) − บิล − งบรายเดือน − รายจ่ายอื่นนอกงบ</small><div style="height:12px"></div><div class="${c.available>=0?'note':'warning'}">${c.available>=0?`หากไม่ได้เงินเข้าเพิ่มและจ่ายบิลที่เหลือครบ จะเหลือ ${money(c.available)}`:`หากไม่ได้เงินเข้าเพิ่ม ต้องมีเงินอีก ${money(-c.available)} เพื่อจ่ายบิลที่เหลือครบ`}</div></div>
      <div class="actionrow" style="margin-bottom:14px"><button class="primary" data-add="income">＋ เพิ่มรายรับ</button><button class="outline" data-add="bill">＋ เพิ่มบิล</button></div><div class="card"><h2 class="title">🌼 งบรายเดือนของฉัน</h2><p class="muted smalltext">กันเงินค่าน้ำมันและหมวดอื่น ๆ ไว้ก่อน แล้วค่อยบันทึกยอดใช้จริง</p>${budgetRows(c)}<button class="outline full" data-tab="plans">＋ จัดการรายจ่ายประจำและงบ</button></div>
      <div class="card"><div class="row between"><h2 class="title">💕 บิลที่ต้องจ่ายเดือนนี้</h2><span class="pill">${c.bills.filter(x=>x.paid).length}/${c.bills.length} จ่ายแล้ว</span></div><div class="progress"><div style="width:${c.total?100*c.paid/c.total:0}%"></div></div>${billRows(c.bills)}<button class="outline full" data-tab="bills">ดูรายการบิลทั้งหมด</button></div>
      <div class="card"><h2 class="title">🧸 สรุปเดือนนี้</h2><div class="summary">${txt}</div><button class="outline full" style="margin-top:10px" data-copy="summary">📋 คัดลอกสรุปไปส่ง LINE</button></div>`;
    }
    function billRows(arr){if(!arr.length)return '<p class="empty">🌼 ยังไม่มีบิล กดเพิ่มรายการได้เลย</p>';return [...arr].sort((a,b)=>Number(a.paid)-Number(b.paid)||(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).map(b=>`<div class="entry"><input class="check" type="checkbox" aria-label="จ่ายแล้ว ${esc(b.name)}" data-toggle-bill="${esc(b.id)}" ${b.paid?'checked':''}/><div class="main"><strong>${esc(b.name)}</strong><small>${b.paid?'✅ จ่ายแล้ว '+when(b):'⏳ รอจ่าย'+(b.dueDate?' · กำหนด '+dateView(b.dueDate):'')}</small></div><div class="money">${money(b.amount)}</div><button class="mini" data-edit-bill="${esc(b.id)}" aria-label="แก้ไข ${esc(b.name)}">✎</button></div>`).join('')}
    function incomeRows(arr){if(!arr.length)return '<p class="empty">🌷 ยังไม่มีรายรับ กดเพิ่มรายรับได้เลย</p>';return [...arr].sort((a,b)=>(b.receivedDate||b.expectedDate||'').localeCompare(a.receivedDate||a.expectedDate||'')).map(x=>`<div class="entry"><input class="check" type="checkbox" aria-label="เงินเข้าแล้ว ${esc(x.name)}" data-toggle-income="${esc(x.id)}" ${x.received?'checked':''}/><div class="main"><strong>${esc(x.name)}</strong><small>${x.received?'✅ เงินเข้าแล้ว '+when(x):'🕒 รอเงินเข้า'+(x.expectedDate?' · คาดว่า '+dateView(x.expectedDate):'')}</small></div><div class="money green">+${money(x.amount)}</div><button class="mini" data-edit-income="${esc(x.id)}" aria-label="แก้ไข ${esc(x.name)}">✎</button></div>`).join('')}
    function billsPage(c){return `<div class="card"><h2 class="title">🧾 บิลเดือนนี้</h2><div class="grid" style="margin:0"><div class="tile"><small>บิลทั้งหมด</small><div class="num">${money(c.billTotal)}</div></div><div class="tile"><small>บิลยังไม่จ่าย</small><div class="num red">${money(c.billTotal-c.billPaid)}</div></div></div><button class="primary full" style="margin-top:14px" data-add="bill">＋ จดบิลใหม่</button><button class="outline full" style="margin-top:8px" data-tab="plans">🌼 ตั้งรายการประจำทุกเดือน / ค่าน้ำมัน</button></div><div class="card"><h2 class="title">💕 เช็กลิสต์บิลของฉัน</h2><p class="muted smalltext">ติ๊กช่องเมื่อจ่ายแล้ว ระบบจะบันทึกวันและเวลาปัจจุบันให้อัตโนมัติ หรือกด ✎ เพื่อแก้ไขวันที่ย้อนหลัง</p>${billRows(c.bills)}</div>`}
    function incomePage(c){return `<div class="card"><h2 class="title">💰 เงินเข้าหลายทาง</h2><div class="grid" style="margin:0"><div class="tile"><small>รับแล้ว</small><div class="num green">${money(c.received)}</div></div><div class="tile"><small>รอรับ</small><div class="num">${money(c.expected-c.received)}</div></div></div><button class="primary full" style="margin-top:14px" data-add="income">＋ จดรายรับใหม่</button></div><div class="card"><h2 class="title">🌷 รายการเงินเข้าของฉัน</h2><p class="muted smalltext">เพิ่มเงินเดือน เงินเวร รายได้เสริม หรือรายรับอื่น ๆ และกำหนดวันที่ได้รับจริงได้</p>${incomeRows(c.incomes)}</div>`}
    function budgetRows(c){if(!c.budgets.length)return '<p class="empty">⛽ ยังไม่ได้ตั้งงบ เช่น ค่าน้ำมัน 3,000 บาท</p>';return c.budgets.map(p=>{let used=sum(c.spends.filter(x=>x.planId===p.id)),remaining=Number(p.amount)-used;return `<div class="entry"><div class="main"><strong>⛽ ${esc(p.name)}</strong><small>ตั้งงบ ${money(p.amount)} · ใช้ไป ${money(used)} · ${remaining>=0?'เหลืองบ '+money(remaining):'เกินงบ '+money(-remaining)}</small><div class="progress" style="margin-top:9px"><div style="width:${Math.min(100,used/Math.max(1,p.amount)*100)}%"></div></div></div><button class="mini" data-addspend="${esc(p.id)}">＋ ใช้</button></div>`}).join('')}
    function plansPage(c){let recurring=db.plans.filter(p=>p.kind==='bill'), budgets=db.plans.filter(p=>p.kind==='budget');return `<div class="card"><h2 class="title">🌼 รายจ่ายประจำของฉัน</h2><p class="muted smalltext">คุณเพิ่มชื่อรายการเองได้ ไม่จำกัดแค่ค่าน้ำมัน เช่น ค่าเช่าบ้าน ค่าเน็ต ค่าผ่อนรถ หรือค่าเลี้ยงสัตว์ รายการประจำจะขึ้นในเดือนปัจจุบันและเดือนถัดไปให้อัตโนมัติ</p><div class="actionrow"><button class="primary" data-addplan="bill">＋ เพิ่มบิลประจำ</button><button class="outline" data-addplan="budget">＋ เพิ่มงบรายเดือน</button></div></div><div class="card"><h2 class="title">🧾 บิลประจำทุกเดือน</h2>${recurring.length?recurring.map(p=>`<div class="entry"><div class="main"><strong>${esc(p.name)}</strong><small>${money(p.amount)} · ครบกำหนดวันที่ ${p.day||1} · เริ่ม ${esc(p.start)}</small></div><button class="mini" data-editplan="${esc(p.id)}">✎</button></div>`).join(''):'<p class="empty">ยังไม่มีบิลประจำ</p>'}</div><div class="card"><h2 class="title">🐷 งบที่กันไว้เดือนนี้</h2>${budgetRows(c)}${budgets.length?'<p class="muted smalltext">แตะ ✎ เพื่อปรับวงเงินสำหรับเดือนถัดไป หรือแตะ ＋ ใช้ เพื่อบันทึกแต่ละครั้ง</p>':''}${budgets.map(p=>`<div class="row between" style="padding:7px 0"><small class="muted">${esc(p.name)} · งบ ${money(p.amount)}</small><button class="mini" data-editplan="${esc(p.id)}">✎ แก้</button></div>`).join('')}</div><div class="card"><h2 class="title">🧋 ประวัติยอดใช้จริงเดือนนี้</h2><button class="outline full" data-addspend="other">＋ เพิ่มรายจ่ายอื่น (นอกงบ)</button>${c.spends.length? [...c.spends].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(s=>`<div class="entry"><div class="main"><strong>${esc(s.name)}</strong><small>${dateView(s.date)}${s.time?' · '+esc(s.time)+' น.':''}</small></div><span class="money">${money(s.amount)}</span><button class="mini" data-editspend="${esc(s.id)}">✎</button></div>`).join(''):'<p class="empty">ยังไม่มีรายการใช้จริง</p>'}</div>`}
    function planModal(kind,item){let edit=!!item, isBudget=kind==='budget';$('modalRoot').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true"><div class="row between"><h2 class="title">🌷 ${edit?'แก้ไข':'เพิ่ม'}${isBudget?'งบรายเดือน':'บิลประจำ'}</h2><button class="close" data-close="1">×</button></div><form id="planForm" class="formgrid"><div class="field"><label>ชื่อรายการ (เพิ่มเองได้)</label><input id="planName" maxlength="80" required placeholder="${isBudget?'เช่น ค่าน้ำมัน ค่าอาหาร':'เช่น ค่าเช่าบ้าน ค่าโทรศัพท์'}" value="${esc(item?.name||'')}"/></div><div class="field"><label>${isBudget?'วงเงินต่อเดือน':'จำนวนเงินต่อเดือน'} (บาท)</label><input id="planAmount" required type="number" min="0.01" max="999999999" step="0.01" inputmode="decimal" value="${esc(item?.amount??'')}" /></div>${isBudget?'':`<div class="field"><label>วันที่ครบกำหนด (1–31)</label><input id="planDay" type="number" min="1" max="31" value="${Number(item?.day||1)}" /></div>`}<p class="muted smalltext">เริ่มใช้ตั้งแต่ ${esc(item?.start||mk())} เป็นต้นไป ไม่แก้บิลเดือนก่อนที่บันทึกไปแล้ว</p><button class="primary full" type="submit">💗 บันทึกรายการประจำ</button>${edit?'<button type="button" id="deletePlan" class="outline full">🗑️ ลบรายการประจำ</button>':''}</form></div></div>`;$('planForm').addEventListener('submit',e=>{e.preventDefault();let n=$('planName').value.trim(),a=Number($('planAmount').value),day=isBudget?1:Number($('planDay').value);if(!n||!Number.isFinite(a)||a<=0||a>999999999||day<1||day>31)return alert('กรุณากรอกข้อมูลให้ถูกต้อง');if(item){let p=db.plans.find(x=>x.id===item.id);Object.assign(p,{name:n,amount:a,day});}else db.plans.push({id:uid(),name:n,amount:a,kind,start:mk(),day});if(!save())return;ensureMonthly();closeModal();render();});if(edit)$('deletePlan').addEventListener('click',()=>{if(!confirm('ลบรายการประจำจากเดือนถัดไปด้วยใช่ไหม? บิลรายเดือนที่สร้างไปแล้วจะยังอยู่'))return;db.plans=db.plans.filter(x=>x.id!==item.id);if(!save())return;closeModal();render();});}
    function spendModal(planId,item){let edit=!!item,plan=db.plans.find(x=>x.id===planId),d=item?.date||dateLocal(),t=item?.time||timeLocal();$('modalRoot').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true"><div class="row between"><h2 class="title">🧋 ${edit?'แก้ไข':'บันทึก'}ยอดใช้จริง</h2><button class="close" data-close="1">×</button></div><form id="spendForm" class="formgrid"><div class="field"><label>ชื่อรายการ</label><input id="spendName" required maxlength="80" value="${esc(item?.name|| (plan?'ใช้จ่าย '+plan.name:''))}" placeholder="เช่น เติมน้ำมัน ปตท." /></div><div class="field"><label>จำนวนเงินที่จ่าย (บาท)</label><input id="spendAmount" type="number" required min="0.01" max="999999999" step="0.01" inputmode="decimal" value="${esc(item?.amount??'')}"/></div><div class="two"><div class="field"><label>วันที่จ่าย</label><input id="spendDate" type="date" required value="${esc(d)}"/></div><div class="field"><label>เวลาจ่าย</label><input id="spendTime" type="time" value="${esc(t)}"/></div></div><div class="note">${plan?'หักจากงบ '+esc(plan.name)+' โดยไม่คิดงบซ้ำ':'เป็นรายจ่ายนอกงบ เพิ่มจากบิลและงบที่ตั้งไว้'}</div><button class="primary full" type="submit">💗 บันทึกการจ่าย</button>${edit?'<button class="outline full" type="button" id="deleteSpend">🗑️ ลบรายการนี้</button>':''}</form></div></div>`;$('spendForm').addEventListener('submit',e=>{e.preventDefault();let n=$('spendName').value.trim(),a=Number($('spendAmount').value),d=$('spendDate').value,t=$('spendTime').value;if(!n||!d||!Number.isFinite(a)||a<=0||a>999999999)return alert('กรุณากรอกข้อมูลให้ถูกต้อง');let record={id:item?.id||uid(),month:mk(),planId:item?.planId|| (plan?plan.id:null),name:n,amount:a,date:d,time:t};if(edit){let i=db.spends.findIndex(x=>x.id===item.id);db.spends[i]=record}else db.spends.push(record);if(!save())return;closeModal();render();});if(edit)$('deleteSpend').addEventListener('click',()=>{if(!confirm('ลบยอดจ่ายนี้ใช่ไหม?'))return;db.spends=db.spends.filter(x=>x.id!==item.id);if(!save())return;closeModal();render();});}
    function settingsPage(){return `<div class="card"><h2 class="title">⚙️ ดูแลสมุดของฉัน</h2><p class="muted smalltext">ข้อมูลเก่าจากเวอร์ชันก่อนจะยังอยู่ในเบราว์เซอร์เดิมเมื่ออัปเดตเว็บที่โดเมนเดิม ข้อมูลถูกเก็บไว้ในเบราว์เซอร์เครื่องนี้ ไม่ได้ส่งขึ้นเซิร์ฟเวอร์ โปรดสำรองข้อมูลเป็นประจำ โดยเฉพาะก่อนเปลี่ยนโทรศัพท์หรือล้างข้อมูล Safari</p><button class="settingsbutton" data-export="1">📦 สำรองข้อมูลเป็นไฟล์ JSON <span>↓</span></button><button class="settingsbutton" data-import="1">📂 นำเข้าข้อมูลที่สำรองไว้ <span>↑</span></button><input type="file" id="importFile" accept="application/json,.json" style="display:none"/><button class="settingsbutton" data-copy="summary">📋 คัดลอกสรุปเดือนนี้ <span>↗</span></button></div><div class="card"><h2 class="title">📱 วิธีไว้บนหน้าจอ iPhone</h2><p class="smalltext">เมื่ออัปโหลดเว็บนี้ขึ้น HTTPS แล้ว เปิดลิงก์ด้วย Safari → กดแชร์ → เพิ่มไปยังหน้าจอโฮม จากนั้นเปิดเหมือนแอปทั่วไปได้เลย</p><div class="warning">ข้อมูลของเวอร์ชันนี้เก็บแยกตามเบราว์เซอร์/อุปกรณ์ ไม่ซิงก์อัตโนมัติข้ามเครื่อง และการล้างข้อมูลเว็บไซต์อาจลบสมุดได้</div></div>`}
    function modal(type,item){let isIncome=type==='income',isEdit=!!item, nowDate=dateLocal(),nowTime=timeLocal(),name=item?.name||'',amt=item?.amount??'',status=isIncome?item?.received??true:item?.paid??false, date=isIncome?(item?.receivedDate||nowDate):(item?.paidDate||nowDate),time=isIncome?(item?.receivedTime||nowTime):(item?.paidTime||nowTime),plan=isIncome?(item?.expectedDate||nowDate):(item?.dueDate||nowDate);
      $('modalRoot').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row between"><h2 class="title" id="modalTitle">${isIncome?'💰':'🧾'} ${isEdit?'แก้ไข':'เพิ่ม'}${isIncome?'รายรับ':'บิลที่ต้องจ่าย'}</h2><button class="close" data-close="1" aria-label="ปิด">×</button></div><form id="recordForm" class="formgrid"><div class="field"><label for="recName">${isIncome?'ชื่อรายรับ':'ชื่อบิล'}</label><input id="recName" required maxlength="80" placeholder="${isIncome?'เช่น เงินเดือน เงินเวร รายได้เสริม':'เช่น ค่าห้อง ค่าผ่อนรถ ค่าไฟ'}" value="${esc(name)}"/></div><div class="field"><label for="recAmount">จำนวนเงิน (บาท)</label><input id="recAmount" type="number" min="0.01" max="999999999999" step="0.01" inputmode="decimal" required placeholder="0" value="${esc(amt)}"/></div><div class="field"><label for="recPlan">${isIncome?'วันที่คาดว่าเงินจะเข้า':'วันครบกำหนดจ่าย'} (ไม่บังคับ)</label><input id="recPlan" type="date" value="${esc(plan)}"/></div><label class="row" style="gap:12px"><input id="recStatus" class="check" type="checkbox" ${status?'checked':''}/><b>${isIncome?'✅ ได้รับเงินแล้ว':'✅ จ่ายแล้ว'}</b></label><div id="actualGroup" class="two ${status?'':'hide'}"><div class="field"><label for="recDate">วันที่${isIncome?'เงินเข้า':'จ่ายจริง'}</label><input id="recDate" type="date" value="${esc(date)}"/></div><div class="field"><label for="recTime">เวลา</label><input id="recTime" type="time" value="${esc(time)}"/></div></div><button class="primary full" type="submit">💗 บันทึกข้อมูล</button>${isEdit?'<button class="outline full" type="button" id="deleteRecord">🗑️ ลบรายการนี้</button>':''}</form></div></div>`;
      $('recStatus').addEventListener('change',()=>{$('actualGroup').classList.toggle('hide',!$('recStatus').checked)});
      $('recordForm').addEventListener('submit',e=>{e.preventDefault();let a=Number($('recAmount').value),n=$('recName').value.trim(),checked=$('recStatus').checked;if(!n||!Number.isFinite(a)||a<=0||a>999999999999)return alert('กรุณากรอกชื่อและจำนวนเงินให้ถูกต้อง');if(checked&&!$('recDate').value)return alert('กรุณาเลือกวันที่จริง');let record={id:item?.id||('r'+Date.now()+Math.random().toString(36).slice(2)),month:mk(),name:n,amount:Math.round(a*100)/100};if(isIncome){Object.assign(record,{received:checked,expectedDate:$('recPlan').value,receivedDate:checked?$('recDate').value:'',receivedTime:checked?$('recTime').value:''})}else{Object.assign(record,{paid:checked,dueDate:$('recPlan').value,paidDate:checked?$('recDate').value:'',paidTime:checked?$('recTime').value:''})}let array=isIncome?db.incomes:db.bills;if(isEdit){let at=array.findIndex(x=>x.id===item.id);if(at>=0)array[at]=record}else array.push(record);save();closeModal();render()});
      if(isEdit)$('deleteRecord').addEventListener('click',()=>{if(confirm('ลบรายการนี้ใช่ไหม?')){let arr=isIncome?db.incomes:db.bills;let i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr.splice(i,1);save();closeModal();render()}});
      $('recName').focus();
    }
    function closeModal(){$('modalRoot').innerHTML=''}
    function toggle(type,id,checked){let arr=type==='income'?db.incomes:db.bills,rec=arr.find(x=>x.id===id);if(!rec)return;let nowDate=dateLocal(),nowTime=timeLocal();if(type==='income'){rec.received=checked;rec.receivedDate=checked?nowDate:'';rec.receivedTime=checked?nowTime:''}else{rec.paid=checked;rec.paidDate=checked?nowDate:'';rec.paidTime=checked?nowTime:''}if(!save())return;render()}
    function summary(){let c=calc();return `🌷 สมุดเงิน ${monthNames[selected.getMonth()]} ${selected.getFullYear()+543}\n💰 รับแล้ว ${money(c.received)}\n🕒 รอรับ ${money(c.expected-c.received)}\n🧾 รายจ่ายตามแผนรวม ${money(c.total)}\n⛽ งบรายเดือน ${money(c.budgetTotal)}\n🛍️ ใช้จริงจากงบ/รายจ่ายอื่น ${money(c.spendTotal)}\n✅ จ่ายแล้ว ${money(c.paid)}\n⏳ ยังต้องจ่าย ${money(c.unpaid)}\n💗 เหลือตอนนี้ ${money(c.now)}\n🐷 คาดว่า${c.forecast>=0?'เหลือเก็บ '+money(c.forecast):'ขาดอีก '+money(-c.forecast)}\n\nงบรายเดือน:\n${c.budgets.map(p=>`${p.name}: งบ ${money(p.amount)} ใช้ไป ${money(sum(c.spends.filter(s=>s.planId===p.id)))}`).join('\n')||'ไม่มี'}\n\nรายการบิล:\n${c.bills.map(x=>`${x.paid?'✅':'⬜'} ${x.name} ${money(x.amount)}`).join('\n')||'ไม่มีรายการ'}`}
    function exportData(){let content=JSON.stringify({version:2,exportedAt:new Date().toISOString(),incomes:db.incomes,bills:db.bills,plans:db.plans,spends:db.spends},null,2),blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-money-diary-backup-'+dateLocal()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    document.addEventListener('click',async e=>{let t=e.target.closest('button');if(!t)return;if(t.id==='prev'||t.id==='next'){selected.setMonth(selected.getMonth()+(t.id==='prev'?-1:1));ensureMonthly();render()}else if(t.dataset.tab){tab=t.dataset.tab;render()}else if(t.dataset.add){modal(t.dataset.add)}else if(t.dataset.addplan){planModal(t.dataset.addplan)}else if(t.dataset.editplan){let p=db.plans.find(x=>x.id===t.dataset.editplan);if(p)planModal(p.kind,p)}else if(t.dataset.addspend){spendModal(t.dataset.addspend)}else if(t.dataset.editspend){let s=db.spends.find(x=>x.id===t.dataset.editspend);if(s)spendModal(s.planId,s)}else if(t.dataset.editBill){modal('bill',db.bills.find(x=>x.id===t.dataset.editBill))}else if(t.dataset.editIncome){modal('income',db.incomes.find(x=>x.id===t.dataset.editIncome))}else if(t.dataset.close){closeModal()}else if(t.dataset.copy){try{await navigator.clipboard.writeText(summary());alert('คัดลอกสรุปแล้วค่ะ 💗')}catch(e){prompt('คัดลอกข้อความนี้',summary())}}else if(t.dataset.export){exportData()}else if(t.dataset.import){$('importFile').click()}});
    document.addEventListener('change',e=>{if(e.target.dataset.toggleBill!==undefined)toggle('bill',e.target.dataset.toggleBill,e.target.checked);if(e.target.dataset.toggleIncome!==undefined)toggle('income',e.target.dataset.toggleIncome,e.target.checked);if(e.target.id==='importFile'){let file=e.target.files[0];if(!file)return;file.text().then(raw=>{try{let obj=JSON.parse(raw);if(!Array.isArray(obj.incomes)||!Array.isArray(obj.bills)||obj.incomes.length>100000||obj.bills.length>100000||![...obj.incomes,...obj.bills].every(x=>x&&typeof x.name==='string'&&x.name.length<=100&&typeof x.month==='string'&&/^\d{4}-\d{2}$/.test(x.month)&&Number.isFinite(Number(x.amount))&&Number(x.amount)>=0&&typeof x.id==='string'))throw Error('invalid');if((obj.plans&&!Array.isArray(obj.plans))||(obj.spends&&!Array.isArray(obj.spends)))throw Error('invalid');if(!confirm('นำเข้าข้อมูลจะทับข้อมูลปัจจุบันทั้งหมด ต้องการดำเนินการหรือไม่?'))return;db={incomes:obj.incomes,bills:obj.bills,plans:Array.isArray(obj.plans)?obj.plans:[],spends:Array.isArray(obj.spends)?obj.spends:[]};save();ensureMonthly();render();alert('นำเข้าข้อมูลเรียบร้อยแล้ว 💗')}catch(err){alert('ไฟล์สำรองไม่ถูกต้องหรืออ่านไม่ได้')}});e.target.value=''}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
    window.addEventListener('error',()=>{flash('เกิดข้อผิดพลาด กรุณาเปิดจากเว็บไซต์จริงใน Safari')});storageNotice();render();
  })();
  </script>
